_versioning:
  - &strict_semver
    version_pattern: "v(?<major>\\d+)\\.(?<minor>\\d+)\\.(?<patch>\\d+)"
    tracking_policy:
      major:
        type: alert
      minor:
        type: delta
        threshold: 6

_devsecops_platforms:
  - &github
    name: "GitHub"
    date_tracking:
      referenced_date: "2025-05-16"
      time_elapsed: "P3M"
  
  - &gitlab
    name: "GitLab"
    version_tracking:
      releases: "https://gitlab.com/gitlab-org/gitlab/-/tags"
      referenced_version: "v17.9.2-ee"
      version_regex: "v(?<major>\\d+)\\.(?<minor>\\d+)\\.(?<patch>\\d+)-ee"
      tracking_policy:
        major:
          type: alert
        minor:
          type: delta
          threshold: 6
  
  - &hashicorp_vault
    name: "HashiCorp Vault"
    version_tracking:
      releases: "https://github.com/hashicorp/vault/releases"
      referenced_version: "v1.19.4"
      <<: *strict_semver